name: Format feature branch once
on:
  push:
    branches: [feature/beach-recovery-shadow-top11-20261027]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/beach-recovery-shadow-top11-20261027
          persist-credentials: true
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: yarn install --immutable
      - name: Autoformat changed TypeScript
        run: yarn exec prettier --write src/main.ts src/don_combo_runtime.ts src/runtime/contracts.ts src/runtime/observations.ts src/runtime/recovery.ts src/runtime/shadow-route.ts
      - name: Commit format-only changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main.ts src/don_combo_runtime.ts src/runtime/contracts.ts src/runtime/observations.ts src/runtime/recovery.ts src/runtime/shadow-route.ts
            git commit -m "style: apply project Prettier format to beach tracking"
            git push origin HEAD:feature/beach-recovery-shadow-top11-20261027
          fi
