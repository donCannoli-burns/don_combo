name: Format WaterSheep fix once
on:
  push:
    branches: [fix/watersheep-relay-gcli-routes-20261027]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/watersheep-relay-gcli-routes-20261027
          persist-credentials: true
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: yarn install --immutable
      - name: Format WaterSheep sources using repository config
        run: yarn exec prettier --write src/main.ts src/don_combo_runtime.ts src/runtime/shadow-route.ts tests/recovery-route.mjs
      - name: Commit format-only changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main.ts src/don_combo_runtime.ts src/runtime/shadow-route.ts tests/recovery-route.mjs
            git commit -m "style: format WaterSheep relay and CLI fix"
            git push origin HEAD:fix/watersheep-relay-gcli-routes-20261027
          fi
