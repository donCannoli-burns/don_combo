name: Format opt-in rare-share once
on:
  push:
    branches: [feat/opt-in-live-rare-kmail-20261028]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opt-in-live-rare-kmail-20261028
          persist-credentials: true
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: yarn install --immutable
      - name: Run pinned ESLint and Prettier
        run: |
          yarn exec eslint src --fix
          yarn exec prettier --write src/main.ts src/runtime/live-rare-share.ts tests/live-rare-share.mjs README.md
      - name: Commit formatter changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main.ts src/runtime/live-rare-share.ts tests/live-rare-share.mjs README.md
            git commit -m "style: format opt-in rare-sharing path"
            git push origin HEAD:feat/opt-in-live-rare-kmail-20261028
          fi
