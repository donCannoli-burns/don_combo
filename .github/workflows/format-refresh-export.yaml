name: Format refresh-export fix once
on:
  push:
    branches: [fix/relay-fresh-refresh-export-20261028]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/relay-fresh-refresh-export-20261028
          persist-credentials: true
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: yarn install --immutable
      - name: Apply pinned Prettier
        run: yarn exec prettier --write tests/refresh-export.mjs src/don_combo_runtime.ts README.md
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/refresh-export.mjs src/don_combo_runtime.ts README.md
            git commit -m "style: apply pinned formatter to relay refresh fix"
            git push origin HEAD:fix/relay-fresh-refresh-export-20261028
          fi
