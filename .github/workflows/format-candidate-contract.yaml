name: Format candidate contract regression
on:
  push:
    branches: [fix/watersheep-representative-minute-20261028]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/watersheep-representative-minute-20261028
          persist-credentials: true
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: yarn install --immutable
      - name: Apply pinned Prettier
        run: yarn exec prettier --write src/runtime/shadow-route.ts tests/recovery-route.mjs
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/runtime/shadow-route.ts tests/recovery-route.mjs
            git commit -m "style: apply pinned format to candidate contract regression"
            git push origin HEAD:fix/watersheep-representative-minute-20261028
          fi
