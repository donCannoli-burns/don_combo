name: Format collision-safe Combo entrypoint once
on:
  push:
    branches: [fix/collision-safe-doncombo-cli-entrypoint-20261028]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/collision-safe-doncombo-cli-entrypoint-20261028
          persist-credentials: true
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: yarn install --immutable
      - name: Canonical repository formatter
        run: |
          yarn exec eslint src --fix
          yarn exec prettier --write src/main.ts tests/entrypoint-collision.mjs rollup.config.ts README.md
      - name: Commit formatter changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main.ts tests/entrypoint-collision.mjs rollup.config.ts README.md
            git commit -m "style: format collision-resistant DonCombo entrypoint"
            git push origin HEAD:fix/collision-safe-doncombo-cli-entrypoint-20261028
          fi
