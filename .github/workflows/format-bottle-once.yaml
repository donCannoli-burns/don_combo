name: Format bottle observer once
on:
  push:
    branches: [feat/bottle-unknown-pool-provenance-20261028]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bottle-unknown-pool-provenance-20261028
          persist-credentials: true
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: yarn install --immutable
      - name: Pinned ESLint and Prettier
        run: |
          yarn exec eslint src --fix
          yarn exec prettier --write src/runtime/bottle-observer.ts src/main.ts src/runtime/observations.ts src/runtime/two-pool-cooldown.ts src/runtime/pool-timescales.ts src/runtime/contracts.ts src/don_combo_runtime.ts tests/bottle-observer.mjs README.md
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/runtime/bottle-observer.ts src/main.ts src/runtime/observations.ts src/runtime/two-pool-cooldown.ts src/runtime/pool-timescales.ts src/runtime/contracts.ts src/don_combo_runtime.ts tests/bottle-observer.mjs README.md
            git commit -m "style: format bottle observer"
            git push origin HEAD:feat/bottle-unknown-pool-provenance-20261028
          fi
