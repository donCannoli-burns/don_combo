name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: don-combo-build-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  node-version: "22"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn run build

      - name: Relay inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("mafia/relay/don_combo_matrix.html", "utf8");
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map((m) => m[1].trim())
            .filter(Boolean);
          if (!scripts.length) throw new Error("no inline relay script found");
          for (const source of scripts) new Function(source);
          console.log(`relay inline JS syntax: PASS (${scripts.length} script block)`);
          NODE

      - name: Collision-resistant DonCombo CLI build and diagnostic regression
        run: node tests/entrypoint-collision.mjs

      - name: Read-only report compatibility and ES2018 runtime regression
        run: node tests/run-interface.mjs

      - name: Progressive WaterSheep gCLI pre-scoring estimate regression
        run: node --experimental-strip-types tests/prescore-progress.mjs

      - name: Offline recovery and top-11 route regressions
        run: node --experimental-strip-types tests/recovery-route.mjs

      - name: Beach choice recovery, native receipt and no-retry guards
        run: node --experimental-strip-types tests/beach-choice-guard.mjs

      - name: Offline WaterSheep POST adapter transport regressions
        run: python3 tests/watersheep-post-adapter.py

      - name: Source-level WaterSheep transport boundary
        run: node tests/watersheep-transport.mjs

      - name: Offline daily shadow cohort invariants
        run: node --experimental-strip-types tests/shadow-learning.mjs

      - name: Scratch-density live, shadow and historical daily-interest regressions
        run: node --experimental-strip-types tests/scratch-interest.mjs

      - name: End-to-end evidence lifecycle and three hypothesized timescales
        run: node --experimental-strip-types tests/evidence-lifecycle-audit.mjs

      - name: Opt-in live rare sharing privacy and no-history Kmail regression
        run: node --experimental-strip-types tests/live-rare-share.mjs

      - name: Castle layout sighting, native selection and no fake rare reward regression
        run: node --experimental-strip-types tests/sandcastle-observer.mjs

      - name: Non-inventory message-bottle and unknown-pool regression
        run: node --experimental-strip-types tests/bottle-observer.mjs

      - name: Dual rare pool and historical cooldown baseline regressions
        run: node --experimental-strip-types tests/two-pool-cooldown.mjs

      - name: Historical rare baseline and WaterSheep paid/free learning regressions
        run: node --experimental-strip-types tests/historical-rares.mjs

      - name: Native relay refresh and stale-export regression
        run: node tests/refresh-export.mjs

      - name: Relay DOM target contract
        run: |
          node <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("mafia/relay/don_combo_matrix.html", "utf8");
          const ids = [...html.matchAll(/getElementById\(["']([^"']+)["']\)/g)].map((m) => m[1]);
          const unique = [...new Set(ids)].sort();
          const missing = unique.filter((id) => !html.includes('id="' + id + '"') && !html.includes("id='" + id + "'"));
          if (missing.length) throw new Error("relay JS references missing DOM ids: " + missing.join(", "));
          console.log("relay DOM target contract: PASS (" + unique.length + " literal ids)");
          NODE

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Linting
        run: yarn run lint

  deploy:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn run build

      - name: Push to Release
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: release
          FOLDER: dist
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "Build: ({sha}) {msg}"
          SKIP_EMPTY_COMMITS: true

  # TEMPORARY one-branch formatting task; remove after it commits the nine
  # identified source-format files. Does not run on main or other PR branches.
  format_existing_lint_files:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == 'donCannoli-burns/don_combo' &&
      github.event.pull_request.head.ref == 'fix/beach-choice-transaction-20261029'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}
      - run: yarn install --immutable
      - name: Format exactly the nine files reported by Prettier
        run: |
          yarn prettier --write \
            mafia/scripts/don_combo.js README.md src/main.ts \
            src/runtime/run-interface.ts tests/beach-choice-guard.mjs \
            tests/bottle-observer.mjs tests/hook-recovery.mjs \
            tests/run-interface.mjs tests/watersheep-transport.mjs
      - name: Commit formatter results only to this PR branch
        run: |
          git add -- \
            mafia/scripts/don_combo.js README.md src/main.ts \
            src/runtime/run-interface.ts tests/beach-choice-guard.mjs \
            tests/bottle-observer.mjs tests/hook-recovery.mjs \
            tests/run-interface.mjs tests/watersheep-transport.mjs
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "style(combo): format nine lint-blocking files"
          git push origin HEAD:fix/beach-choice-transaction-20261029
