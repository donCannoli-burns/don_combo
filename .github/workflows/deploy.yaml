name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: don-combo-build-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  node-version: "22"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn run build

      - name: Relay inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("mafia/relay/don_combo_matrix.html", "utf8");
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map((m) => m[1].trim())
            .filter(Boolean);
          if (!scripts.length) throw new Error("no inline relay script found");
          for (const source of scripts) new Function(source);
          console.log(`relay inline JS syntax: PASS (${scripts.length} script block)`);
          NODE

      - name: Relay DOM target contract
        run: |
          node <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("mafia/relay/don_combo_matrix.html", "utf8");
          const ids = [...html.matchAll(/getElementById\(["']([^"']+)["']\)/g)].map((m) => m[1]);
          const unique = [...new Set(ids)].sort();
          const missing = unique.filter((id) => !html.includes('id="' + id + '"') && !html.includes("id='" + id + "'"));
          if (missing.length) throw new Error("relay JS references missing DOM ids: " + missing.join(", "));
          console.log("relay DOM target contract: PASS (" + unique.length + " literal ids)");
          NODE

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Linting
        run: yarn run lint

  deploy:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn run build

      - name: Push to Release
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: release
          FOLDER: dist
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "Build: ({sha}) {msg}"
          SKIP_EMPTY_COMMITS: true
