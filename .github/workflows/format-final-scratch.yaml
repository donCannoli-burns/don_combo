name: Format final scratch feature once
on:
  push:
    branches: [feature/scratch-density-daily-evidence-20261028]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/scratch-density-daily-evidence-20261028
          persist-credentials: true
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: yarn install --immutable
      - name: Apply pinned formatter to final feature source
        run: yarn exec prettier --write src/runtime/shadow-learning.ts src/runtime/scratch-interest.ts tests/scratch-interest.mjs src/don_combo_runtime.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/runtime/shadow-learning.ts src/runtime/scratch-interest.ts tests/scratch-interest.mjs src/don_combo_runtime.ts
            git commit -m "style: format final scratch-density feature"
            git push origin HEAD:feature/scratch-density-daily-evidence-20261028
          fi
