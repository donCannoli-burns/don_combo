name: Format WaterSheep progress once
on:
  push:
    branches: [feat/watersheep-prescore-gcli-progress-20261028]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/watersheep-prescore-gcli-progress-20261028
          persist-credentials: true
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: yarn install --immutable
      - name: Format source and tests via pinned toolchain
        run: |
          yarn exec eslint src --fix
          yarn exec prettier --write src/main.ts src/don_combo_runtime.ts src/runtime/prescore-progress.ts tests/prescore-progress.mjs README.md
      - name: Commit formatter changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main.ts src/don_combo_runtime.ts src/runtime/prescore-progress.ts tests/prescore-progress.mjs README.md
            git commit -m "style: format progressive gCLI wait"
            git push origin HEAD:feat/watersheep-prescore-gcli-progress-20261028
          fi
